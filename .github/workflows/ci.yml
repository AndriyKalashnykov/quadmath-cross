name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    name: changes
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          # `base` is required so `make ci-run` (act push) works: act's synthetic
          # event payload omits repository.default_branch, which paths-filter
          # falls back to. On pull_request events the action uses the PR base and
          # ignores this input, so gate it to push events only.
          base: ${{ github.event_name == 'push' && 'main' || '' }}
          # 'every': a file counts as `code` only if it matches '**' AND none of
          # the '!' exclusions. The default ('some') matches a file if it matches
          # ANY pattern, so the '**' catch-all always wins and the exclusions are
          # ignored — making docs-only changes still trigger the full build.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              # Exclude every .md EXCEPT CLAUDE.md — CLAUDE.md is project config,
              # not documentation, so a change to it must trigger the build.
              - '!**/!(CLAUDE).md'
              - '!LICENSE'
              - '!.gitignore'
              - '!.dockerignore'

  docker-image-test:

    runs-on: ubuntu-24.04
    name: docker-image-test
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' || github.ref_type == 'tag' }}
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up tools (mise)
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4
        with:
          # Pin mise itself for reproducible CI. As of 2026-06-14, mise.jdx.dev/VERSION
          # advanced to 2026.6.7 before that release's linux-x64 asset was published, so
          # the action's default (fetch latest) 404s. Bump when a newer release is healthy.
          version: "2026.6.6"
          install: true
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build and test Docker images
        run: make ci

  docker-image-builder:

    if: github.ref_type == 'tag'

    runs-on: ubuntu-24.04
    name: docker-image-builder
    needs: [ docker-image-test ]
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Convert owner to lower case
        run: |
          echo "OWNER_LC=${OWNER,,}" >> "${GITHUB_ENV}"
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta_builder
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/quadmath-cross
          flavor: |
            latest=false
            suffix=-builder
          tags: |
            type=ref,event=tag
            type=semver,pattern=v{{version}}
          labels: |
            org.opencontainers.image.vendor=Andriy Kalashnykov - andriykalashnykov@gmail.com
            org.opencontainers.image.title=Cross compile quadmath - amd64 builder
            org.opencontainers.image.description=Cross compile quadmath - amd64 builder
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ github.ref_name }}
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/AndriyKalashnykov/quadmath-cross/main/README.md
            io.artifacthub.package.maintainers=[{"name":"Andriy Kalashnykov","email":"andriykalashnykov@gmail.com"}]
            io.artifacthub.package.license=MIT

      - name: Build and push docker_builder
        id: docker_builder
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./Dockerfile.builder
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta_builder.outputs.tags }}
          labels: ${{ steps.meta_builder.outputs.labels }}
          cache-from: type=gha,scope=builder
          cache-to: type=gha,mode=max,scope=builder

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign builder image (keyless)
        env:
          DIGEST: ${{ steps.docker_builder.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${OWNER_LC}/quadmath-cross@${DIGEST}"

      - name: Output docker_builder image digest
        env:
          DIGEST: ${{ steps.docker_builder.outputs.digest }}
        run: echo "$DIGEST"

  docker-image-runtime:

    if: github.ref_type == 'tag'

    runs-on: ubuntu-24.04
    name: docker-image-runtime
    needs: [ docker-image-test, docker-image-builder ]
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Convert owner to lower case
        run: |
          echo "OWNER_LC=${OWNER,,}" >> "${GITHUB_ENV}"
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta_runtime
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/quadmath-cross
          flavor: |
            latest=false
            suffix=-runtime
          tags: |
            type=ref,event=tag
            type=semver,pattern=v{{version}}
          labels: |
            org.opencontainers.image.vendor=Andriy Kalashnykov - andriykalashnykov@gmail.com
            org.opencontainers.image.title=Cross compile quadmath - runtime
            org.opencontainers.image.description=Cross compile quadmath - runtime
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ github.ref_name }}
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/AndriyKalashnykov/quadmath-cross/main/README.md
            io.artifacthub.package.maintainers=[{"name":"Andriy Kalashnykov","email":"andriykalashnykov@gmail.com"}]
            io.artifacthub.package.license=MIT

      # Build the amd64 runtime locally first so it can be scanned and smoke
      # tested before any multi-arch push to the registry.
      - name: Build runtime image (amd64, for scan and smoke test)
        id: build_local
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./Dockerfile.runtime
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          build-args: |
            BUILDER_IMAGE=ghcr.io/${{ env.OWNER_LC }}/quadmath-cross:${{ github.ref_name }}-builder
          tags: ghcr.io/${{ env.OWNER_LC }}/quadmath-cross:runtime-scan
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Trivy image scan (CRITICAL/HIGH blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER_LC }}/quadmath-cross:runtime-scan
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Smoke test runtime image
        run: |
          out="$(docker run --rm "ghcr.io/${OWNER_LC}/quadmath-cross:runtime-scan" /app/qm-x86_64)"
          echo "$out"
          echo "$out" | grep -q '1.41421356237309504880' \
            || { echo "Smoke test failed: qm-x86_64 did not print sqrt(2)."; exit 1; }

      - name: Build and push runtime
        id: docker_runtime
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./Dockerfile.runtime
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            BUILDER_IMAGE=ghcr.io/${{ env.OWNER_LC }}/quadmath-cross:${{ github.ref_name }}-builder
          tags: ${{ steps.meta_runtime.outputs.tags }}
          labels: ${{ steps.meta_runtime.outputs.labels }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign runtime image (keyless)
        env:
          DIGEST: ${{ steps.docker_runtime.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${OWNER_LC}/quadmath-cross@${DIGEST}"

      - name: Output docker_runtime image digest
        env:
          DIGEST: ${{ steps.docker_runtime.outputs.digest }}
        run: echo "$DIGEST"

  ci-pass:
    if: always()
    runs-on: ubuntu-24.04
    name: ci-pass
    # List ALL upstream jobs (including the tag-only publish jobs) so a failed
    # release is visible on the commit status. Skipped jobs (builder/runtime on
    # non-tag pushes) count as success, not failure, so this stays green on PRs.
    needs: [ changes, docker-image-test, docker-image-builder, docker-image-runtime ]
    timeout-minutes: 5
    steps:
      - name: Verify required jobs succeeded
        run: |
          echo "changes=${{ needs.changes.result }} docker-image-test=${{ needs.docker-image-test.result }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] \
             || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
          echo "All required jobs passed or were skipped."
